name: algorithm_visualizer
description: "AlgoDive — watch algorithms think, then solve 100 interview problems graded offline on your device."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.5.0
  get_it: ^9.2.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2
  get_storage: ^2.1.1
  collection: ^1.19.1
  async: ^2.13.1

  cupertino_icons: ^1.0.9
  json_annotation: ^4.9.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.10.0
  sentry_flutter: ^9.29.0
  firebase_analytics: ^12.5.0
  url_launcher: ^6.3.2
  firebase_app_check: ^0.4.8
  # Already present transitively via sentry_flutter; declared directly so
  # AppInfo can read the version the build was actually stamped with.
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
#  very_good_analysis: ^10.3.0
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  # Flavor tooling (build-time only, never shipped):
  # - flutter_launcher_icons: regenerates mipmap-*/AppIcon.appiconset per flavor
  #   from assets/logo/png/ (production) or tool/flavor_icons/custom/ (dev/staging)
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  fonts:
    # App UI family. Loaded natively (no google_fonts) — see
    # lib/core/resources/font_manager.dart FontConstants.fontFamily.
    - family: IBM Plex Sans Arabic
      fonts:
        # Thin (100) and ExtraLight (200) are not declared: nothing references
        # FontWeightManager.light100 or .light200, and each .ttf is ~235 KB, so
        # they were ~470 KB of bundle that never rendered a glyph. The constants
        # stay in font_manager.dart — re-add the assets here if a design ever
        # calls for them.
        #
        # and `GetLightStyle` still exist. Neither has a single call site — if
        # you are happy to delete them, this asset saves another ~233 KB.
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Legacy bundled mono, kept for pre-CoreDive screens that reference
    # FontConstants.fontJetBrainsMono directly.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
  assets:
    - assets/problems.json
    - assets/logo/svg/
    - shorebird.yaml
# firebase_auth 6.7.0 calls FirebaseAuthPlatform.setSettings(migrateCurrentUser:
# ...), but its own pubspec only requires firebase_auth_platform_interface
# ^9.0.7 — that parameter was added in 9.1.0. Pub resolves to the lowest
# version satisfying every constraint (9.0.7), which does not have it, so the
# build fails at compile time. This is an upstream constraint bug in
# firebase_auth 6.7.0, not a version in our control — remove this override
# once a firebase_auth release tightens its own constraint to ^9.1.0.
dependency_overrides:
  firebase_auth_platform_interface: ^9.1.0
