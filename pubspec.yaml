name: algorithm_visualizer
description: "This will be something great"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.5.0
  get_it: ^9.2.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2
  get_storage: ^2.1.1
  animations: ^3.0.0
  collection: ^1.19.1
  async: ^2.13.1
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0

  cupertino_icons: ^1.0.9
  json_annotation: ^4.9.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  sentry_flutter: ^9.29.0
  firebase_analytics: ^12.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
#  very_good_analysis: ^10.3.0
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  # Flavor tooling (build-time only, never shipped):
  # - flutter_launcher_icons: regenerates mipmap-*/AppIcon.appiconset per flavor
  #   from assets/logo/png/ (production) or tool/flavor_icons/custom/ (dev/staging)
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    # Legacy bundled mono, kept for pre-CoreDive screens that reference
    # FontConstants.fontJetBrainsMono directly. The CoreDive `mono` scale
    # (CdText.mono) resolves JetBrains Mono 400/500/700 through google_fonts
    # instead — see lib/core/resources/typography_manager.dart.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
  assets:
    - assets/problems.json