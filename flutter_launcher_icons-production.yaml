# Regenerates the production launcher icon for every density, every Android
# version (legacy, adaptive, Android 13+ monochrome/themed) and every iOS
# appearance (light, dark, tinted), straight from the brand art in
# assets/logo/png/ (see assets/logo/README.md).
#   dart run flutter_launcher_icons -f flutter_launcher_icons-production.yaml
#
# Writes Android output to android/app/src/production/res/** and the
# `AppIcon-production` set in the iOS asset catalog. Run this whenever the
# brand art in assets/logo/png/ changes.
flutter_launcher_icons:
  image_path: "assets/logo/png/app-icon-1024.png"
  image_path_ios_dark_transparent: "assets/logo/png/mark-white-1024.png"
  image_path_ios_tinted_grayscale: "assets/logo/png/mark-white-1024.png"
  desaturate_tinted_to_grayscale_ios: true

  android: true
  min_sdk_android: 21
  # Ground colour from assets/logo/README.md. Flutter writes this as a
  # @color/ic_launcher_background resource, so Android draws it natively
  # instead of us shipping a flat background PNG.
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/logo/png/android-adaptive-foreground-432.png"
  # The art already pads the mark to 36% of its canvas, so the plugin's
  # default 16% inset made it look tiny on Android.
  # The plugin does not write ic_launcher_round.xml, which most launchers use,
  # so copy ic_launcher.xml over it in production/res/mipmap-anydpi-v26 after
  # every regenerate.
  adaptive_icon_foreground_inset: 0
  # Android 13+ "themed icon" layer: the OS tints this to match the user's
  # wallpaper/theme. Only the alpha channel is used, so the mark's own
  # colours don't matter here.
  adaptive_icon_monochrome: "assets/logo/png/android-adaptive-foreground-432.png"

  ios: true
  remove_alpha_ios: true
