name: 💡 Feature request
description: Suggest a new capability or an improvement to an existing one
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea!

        Want to suggest a **specific algorithm** to visualize? There's a
        dedicated template for that — please use
        [🧮 Algorithm request](https://github.com/AhmedAbdoElhawary/flutter-algorithm-visualizer/issues/new?template=algorithm_request.yml)
        instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and the README roadmap, and this isn't already planned
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the frustration, not the solution. This is the most useful part of the request.
      placeholder: When I change playback speed mid-run, I lose my place and have to restart.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      placeholder: Speed changes should apply to the next step instead of resetting the run.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Optional. Other approaches, or how another app solves this.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Sorting visualizer
        - Pathfinding visualizer
        - Code editor / Practice
        - Profile / statistics
        - Sign in / account
        - Home
        - Accessibility
        - Localization / translations
        - Developer experience (build, tests, CI)
        - Something else
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: Mockup or reference
      description: Optional. A sketch, screenshot, or link to something similar.

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - label: I'd be willing to open a PR for this
