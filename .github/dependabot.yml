version: 2

updates:
  # Dart / Flutter packages
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    target-branch: "develop"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      # One PR for all Firebase packages — they are versioned together and
      # updating them piecemeal tends to break the build.
      firebase:
        patterns:
          - "firebase_*"
          - "cloud_firestore"
      # Patch and minor bumps are low risk; batch them into a single PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by ci.yml, deploy.yml and patch.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Android Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "monthly"
    target-branch: "develop"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "deps(android)"
