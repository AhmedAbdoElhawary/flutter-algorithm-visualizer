name: Deploy

# A version TAG -> build that flavor's release artifact -> upload to that
# flavor's own Firebase project via App Distribution. Nobody creates these tags
# by hand; release-on-merge.yml creates one after a PR merges and calls this
# workflow with it.
#
# Tag shapes (one version line, stage as a suffix):
#   v1.3.0-dev.2   -> environment "development" -> flavor dev        -> algodive-dev
#   v1.3.0-stag.1  -> environment "staging"     -> flavor staging    -> algodive-staging
#   v1.3.0         -> environment "production"  -> flavor production -> algodive-prod
#
# Each GitHub Environment holds its own secrets (same names, different values):
#   ANDROID_GOOGLE_SERVICES_JSON   that project's google-services.json (raw text)
#   ANDROID_KEYSTORE_BASE64        `base64 -w0 release.jks`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   FIREBASE_TOKEN                 `firebase login:ci` token. dev + staging share
#                                 one token (same Google account); production
#                                 needs its OWN token (separate account) — do not
#                                 reuse the dev/staging token there.
#   FIREBASE_ANDROID_APP_ID        the 1:...:android:... id from that project
# Optional repo/environment variable:
#   FIREBASE_TESTER_GROUPS         comma list of tester groups (default: "testers")
#
# The "production" environment has "Required reviewers" enabled, so a v1.2.3
# tag pauses here until someone approves it under the run's
# "Review deployments" prompt. Nothing reaches testers before that.
#
# production-environment secret: SHOREBIRD_TOKEN — a Shorebird console API
# key (Account -> API Keys; `shorebird login:ci` is removed). Used by the
# production build only: production is built
# through `shorebird release android` so it can be hotfixed later via
# patch.yml, while dev and staging use plain `flutter build apk` (they ship
# often enough that a new tag is the simpler fix). A plain `flutter build`
# artifact can never receive a Shorebird patch, so the production path must
# always stay on Shorebird — see .github/RELEASES.md.

on:
  # The normal path: release-on-merge.yml creates the tag after a PR merges and
  # calls this workflow with it. A tag pushed by GITHUB_TOKEN does not fire
  # `on: push`, so deploy has to be called rather than left to self-trigger.
  workflow_call:
    inputs:
      tag:
        description: The version tag to build and ship.
        required: true
        type: string
  # Break-glass only. A hand-pushed `v*` tag lands here. The ruleset cannot
  # block creating one on a personal repo, but the guard job still refuses a
  # tag that is not on its branch, and production still waits for approval.
  push:
    tags:
      - "v*"

permissions:
  contents: write # the production job creates a GitHub Release

concurrency:
  group: deploy-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.map.outputs.tag }}
      environment: ${{ steps.map.outputs.environment }}
      flavor: ${{ steps.map.outputs.flavor }}
      target: ${{ steps.map.outputs.target }}
      dart_define: ${{ steps.map.outputs.dart_define }}
      branch: ${{ steps.map.outputs.branch }}
      version: ${{ steps.map.outputs.version }}
      is_production: ${{ steps.map.outputs.is_production }}
    steps:
      - id: map
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v*-dev.*)
              env=development; flavor=dev;        target=lib/main_dev.dart;     define=dart_define/dev.json;     branch=develop;    prod=false ;;
            v*-stag.*)
              env=staging;     flavor=staging;    target=lib/main_staging.dart; define=dart_define/staging.json; branch=staging;    prod=false ;;
            v[0-9]*)
              env=production;  flavor=production; target=lib/main_prod.dart;    define=dart_define/prod.json;    branch=production; prod=true ;;
            *)
              echo "::error::deploy.yml does not recognize tag '$tag' — expected v<x.y.z>-dev.<n>, v<x.y.z>-stag.<n>, or v<x.y.z>"; exit 1 ;;
          esac
          # Strip the leading 'v' and any -dev.N / -stag.N suffix to get the base
          # version, e.g. v1.3.0-dev.2 -> 1.3.0. Used as --build-name.
          version="${tag#v}"
          version="${version%%-*}"
          {
            echo "tag=$tag"
            echo "environment=$env"
            echo "flavor=$flavor"
            echo "target=$target"
            echo "dart_define=$define"
            echo "branch=$branch"
            echo "version=$version"
            echo "is_production=$prod"
          } >> "$GITHUB_OUTPUT"

  guard:
    name: Verify tag is on its branch
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Confirm the tagged commit is reachable from ${{ needs.resolve.outputs.branch }}
        run: |
          branch="${{ needs.resolve.outputs.branch }}"
          tag="${{ needs.resolve.outputs.tag }}"
          if ! git merge-base --is-ancestor "$tag" "origin/$branch"; then
            echo "::error::tag '$tag' is not on branch '$branch' — refusing to ship a mismatched tag/branch pair"
            exit 1
          fi

  verify:
    name: Analyze & test
    needs: [resolve, guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.7 # keep in sync with the team's local toolchain
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define-from-file=${{ needs.resolve.outputs.dart_define }}

  android:
    name: Build & distribute (Android)
    needs: [resolve, guard, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Selecting the environment is what injects that environment's secrets AND
    # enforces the production approval gate before this job starts.
    environment: ${{ needs.resolve.outputs.environment }}
    outputs:
      release_notes_file: release-notes.txt
    env:
      FLAVOR: ${{ needs.resolve.outputs.flavor }}
      TARGET: ${{ needs.resolve.outputs.target }}
      DART_DEFINE: ${{ needs.resolve.outputs.dart_define }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0 # need full tag history for the auto commit-list notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.7 # keep in sync with the team's local toolchain
          cache: true

      # Shorebird is production-only: dev and staging ship often enough that a
      # new tag is the simpler fix, and keeping code push to one flavor keeps
      # the free patch-install allowance for the builds that actually need it.
      - name: Setup Shorebird
        if: needs.resolve.outputs.is_production == 'true'
        uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1.0.1
        with:
          cache: true

      - run: flutter pub get

      - name: Restore this flavor's google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "::error::ANDROID_GOOGLE_SERVICES_JSON is empty for environment '${{ needs.resolve.outputs.environment }}'"; exit 1; }
          mkdir -p "android/app/src/${FLAVOR}"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "android/app/src/${FLAVOR}/google-services.json"

      # THIS REPO IS PUBLIC, so the Sentry DSN is not committed. It is written
      # here into the git-ignored *.secret.json that the build reads alongside
      # the committed dart_define file, then scrubbed with the keystore below.
      # A DSN is only a client key, but keeping it out of a public repo stops
      # a stranger flooding the project and burning the free event quota.
      - name: Write Sentry DSN for this flavor
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "::warning::SENTRY_DSN is not set for environment '${{ needs.resolve.outputs.environment }}' — this build will ship with crash reporting disabled"
            printf '{}\n' > "dart_define/${FLAVOR}.secret.json"
          else
            python3 -c 'import json,os,sys; json.dump({"SENTRY_DSN": os.environ["SENTRY_DSN"]}, open(sys.argv[1],"w"))' "dart_define/${FLAVOR}.secret.json"
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is empty for environment '${{ needs.resolve.outputs.environment }}'"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/android/app/release.jks"
          # printf per line so a password containing $, backticks, etc. is written literally.
          {
            printf 'storeFile=%s\n' "${GITHUB_WORKSPACE}/android/app/release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "${GITHUB_WORKSPACE}/android/key.properties"

      - name: Build release notes
        run: |
          # The build number on the App Distribution card is github.run_number,
          # which counts deploy runs, not tags — so name the tag here or a
          # tester has no way to tell which one they installed.
          printf '%s\n\n' "${{ needs.resolve.outputs.tag }}" > release-notes.txt
          if [ "${{ needs.resolve.outputs.is_production }}" = "true" ]; then
            # Production: the hand-written CHANGELOG.md entry, approved by the
            # user in the /promote flow before this tag was ever pushed.
            python3 tool/changelog_release_notes.py >> release-notes.txt
          else
            # Dev/staging: auto-generated list of commits since the previous
            # tag in this same stage (same -dev./-stag. suffix family).
            python3 tool/changelog_release_notes.py --auto-since-previous-tag "${{ needs.resolve.outputs.tag }}" >> release-notes.txt
          fi
          echo "----- release notes -----"; cat release-notes.txt

      # Production goes through `shorebird release`, which produces the same
      # signed APK as `flutter build` but also registers the build with
      # Shorebird so patch.yml can hotfix it later. A build made with plain
      # `flutter build` can NEVER receive a patch, so production must always
      # take the Shorebird path — including the first Play Store upload.
      # Dev and staging use plain `flutter build`: they are not patchable, and
      # do not need to be, because a new -dev.N / -stag.N tag ships in minutes.
      # Production ships an Android App Bundle, not an APK: Google Play has
      # required AAB for new apps since August 2021, so an APK cannot be
      # uploaded at all. `--obfuscate --split-debug-info` strips the Dart
      # symbols out of the shipped binary and writes them to build/symbols —
      # without it the release carries its own symbol table, and the AAB is
      # both bigger and trivially readable.
      #
      # `--flutter-version` is pinned because `shorebird release` ignores the
      # Flutter that setup-flutter just installed and uses its own, which
      # defaults to the latest stable. Left unpinned, production would ship on
      # a Flutter the verify job never tested, and every later `shorebird
      # patch` would have to match this exact version or be refused — so the
      # pin has to equal the flutter-version above and the one in patch.yml.
      - name: Build release bundle (Shorebird — production)
        if: needs.resolve.outputs.is_production == 'true'
        run: |
          shorebird release android \
            --artifact aab \
            --flavor "$FLAVOR" \
            --flutter-version 3.44.7 \
            -t "$TARGET" \
            --build-name "$VERSION" \
            --build-number "${{ github.run_number }}" \
            --no-confirm \
            -- \
            --dart-define-from-file="$DART_DEFINE" \
            --dart-define-from-file="dart_define/${FLAVOR}.secret.json" \
            --obfuscate \
            --split-debug-info=build/symbols
          echo "ARTIFACT=build/app/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab" >> "$GITHUB_ENV"

      # Dev and staging stay on APK: they go to Firebase App Distribution,
      # which installs a file directly onto a tester's device, and that has to
      # be an APK.
      - name: Build release APK (dev / staging)
        if: needs.resolve.outputs.is_production != 'true'
        run: |
          flutter build apk --release \
            --flavor "$FLAVOR" \
            -t "$TARGET" \
            --dart-define-from-file="$DART_DEFINE" \
            --dart-define-from-file="dart_define/${FLAVOR}.secret.json" \
            --build-name "$VERSION" \
            --build-number "${{ github.run_number }}"
          echo "ARTIFACT=build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk" >> "$GITHUB_ENV"

      - name: Verify the artifact is signed with the release key (not debug)
        run: |
          test -f "$ARTIFACT" || { echo "::error::expected artifact not found at $ARTIFACT"; exit 1; }
          case "$ARTIFACT" in
            *.aab)
              # An AAB carries a JAR signature, which apksigner does not read.
              certs="$(jarsigner -verify -verbose:summary -certs "$ARTIFACT" 2>&1)"
              ;;
            *)
              # Flutter/AGP signs APKs v2/v3 only (no JAR signature), so use apksigner.
              apksigner="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
              if [ -z "$apksigner" ]; then echo "::warning::apksigner not found — skipping signature check"; exit 0; fi
              certs="$("$apksigner" verify --print-certs "$ARTIFACT")"
              ;;
          esac
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::artifact is debug-signed — check the ANDROID_KEYSTORE_* secrets for environment '${{ needs.resolve.outputs.environment }}'"; exit 1
          fi

      # Sentry needs the symbol files that --split-debug-info just stripped
      # out, or every production stack trace arrives as bare hex addresses.
      #
      # This fails the release rather than warning past it. A production build
      # whose crashes cannot be read is not worth shipping — the whole reason
      # monitoring exists is the one case you cannot reproduce locally.
      #
      # Needs two things set. Either the production Environment or the repo
      # works — the job selects the production Environment, so it sees both.
      #   SENTRY_AUTH_TOKEN  secret. Sentry -> Settings -> Auth Tokens ->
      #                      Create. Prefer an ORGANIZATION token (sntrys_...)
      #                      over a personal one: it carries its own org, which
      #                      is why SENTRY_ORG below is optional.
      #   SENTRY_PROJECT     secret or variable, the PRODUCTION project's slug — the
      #                      one behind dart_define/prod.secret.json's DSN, not
      #                      dev's. Sentry -> Projects -> the project -> its
      #                      slug is the last part of the browser URL.
      #
      # SENTRY_URL defaults to the EU instance because this account is on the
      # EU data region — the DSNs read `o<id>.ingest.de.sentry.io`. Pointed at
      # the default https://sentry.io/ instead, sentry-cli authenticates
      # against the US instance and a perfectly valid token is rejected as
      # unauthorized. Set a SENTRY_URL secret or variable if that ever moves.
      - name: Upload debug symbols to Sentry
        if: needs.resolve.outputs.is_production == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Read from either namespace. A slug is not a secret, so a variable is
          # the tidier home for it, but GitHub keeps vars and secrets entirely
          # separate — set one as the other and it silently reads as empty.
          # Accepting both means that mistake costs nothing.
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL || secrets.SENTRY_URL || 'https://de.sentry.io/' }}
        run: |
          missing=""
          [ -n "$SENTRY_AUTH_TOKEN" ] || missing="$missing SENTRY_AUTH_TOKEN"
          [ -n "$SENTRY_PROJECT" ]    || missing="$missing SENTRY_PROJECT"
          if [ -n "$missing" ]; then
            echo "::error::cannot symbolicate production crashes — not set:$missing. See the TODO in deploy.yml."
            exit 1
          fi
          # Only an organization token knows its own org. A personal token does
          # not, so that is the one case SENTRY_ORG has to be filled in.
          case "$SENTRY_AUTH_TOKEN" in
            sntrys_*) ;;
            *) [ -n "$SENTRY_ORG" ] || {
                 echo "::error::SENTRY_AUTH_TOKEN is not an organization token (sntrys_...), so SENTRY_ORG must be set. Either set the SENTRY_ORG variable to your org slug, or replace the secret with an organization token."
                 exit 1
               } ;;
          esac
          test -d build/symbols || { echo "::error::build/symbols is missing — did the release step keep --split-debug-info?"; exit 1; }
          # A pinned, checksummed binary rather than `curl get-cli | bash`: this
          # job has the release keystore on disk, so it must not run whatever
          # script a URL happens to serve today.
          curl -sSfL -o "$RUNNER_TEMP/sentry-cli" \
            https://github.com/getsentry/sentry-cli/releases/download/3.8.0/sentry-cli-Linux-x86_64
          echo "13f8cb34ae01a6a272d7d7c22e277a105286615b4020de900ea95a8de47cdbb6  $RUNNER_TEMP/sentry-cli" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sentry-cli"
          export PATH="$RUNNER_TEMP:$PATH"
          # Prove the token reaches the right instance before spending minutes
          # uploading. A token pointed at the wrong data region fails here with
          # a plain auth error instead of a confusing mid-upload one.
          sentry-cli info || { echo "::error::sentry-cli could not authenticate against $SENTRY_URL — check SENTRY_AUTH_TOKEN and the data region."; exit 1; }
          sentry-cli debug-files upload --include-sources build/symbols

      # Play takes the AAB, but App Distribution installs a file straight onto
      # a tester's phone, so it needs an APK. bundletool turns the same AAB
      # into one universal APK signed with the same upload key — same code,
      # same Shorebird release, so a patch reaches these testers too.
      #
      # TODO(ahmed): App Check uses Play Integrity in release, and a sideloaded
      # APK is not Play-recognized. Once enforcement is on in the production
      # Firebase project, these testers' Firestore/Auth calls get rejected —
      # test production through the Play internal track from then on.
      - name: Extract a universal APK for App Distribution (production)
        if: needs.resolve.outputs.is_production == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jar="$RUNNER_TEMP/bundletool.jar"
          curl -sSfL -o "$jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $jar" | sha256sum -c -
          java -jar "$jar" build-apks \
            --bundle="$ARTIFACT" \
            --output="$RUNNER_TEMP/universal.apks" \
            --mode=universal \
            --ks="${GITHUB_WORKSPACE}/android/app/release.jks" \
            --ks-pass="pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass="pass:$KEY_PASSWORD"
          unzip -p "$RUNNER_TEMP/universal.apks" universal.apk > "build/app-${FLAVOR}-universal.apk"
          echo "DIST_ARTIFACT=build/app-${FLAVOR}-universal.apk" >> "$GITHUB_ENV"

      # Every flavor goes to its own Firebase project's testers. Dev and
      # staging upload the APK they built; production uploads the universal
      # APK from the step above.
      #
      # TODO(ahmed): the production Firebase project needs a tester group
      # named "testers" (App Distribution -> Testers & Groups), or set
      # FIREBASE_TESTER_GROUPS as a variable on the production environment.
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          file: ${{ env.DIST_ARTIFACT || env.ARTIFACT }}
          releaseNotesFile: release-notes.txt

      - name: Upload release notes + bundle for the release job
        if: needs.resolve.outputs.is_production == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release-notes.txt
            ${{ env.ARTIFACT }}
          retention-days: 1

      - name: Scrub secrets from the runner
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/android/app/release.jks" \
                "${GITHUB_WORKSPACE}/android/key.properties" \
                "${GITHUB_WORKSPACE}"/dart_define/*.secret.json

  release:
    name: Create GitHub Release
    if: needs.resolve.outputs.is_production == 'true'
    needs: [resolve, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Create the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          body_path: release-notes.txt
          # Production builds an AAB now, so match both rather than only .apk —
          # otherwise the release is created with no binary attached at all.
          # `**/` because download-artifact keeps the build/app/outputs/...
          # path the file was uploaded from; a bare `*` only looks at the root.
          files: |
            **/*-release.aab
            **/*-release.apk
