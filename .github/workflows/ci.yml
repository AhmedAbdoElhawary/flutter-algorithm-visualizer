name: Flutter V_0.1.0

# PR quality gate only. Pushes/merges to develop, staging and production are
# built and shipped by .github/workflows/deploy.yml.
on:
  pull_request:
    branches:
      - develop
      - staging
      - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-guard:
    name: Merge direction check
    runs-on: ubuntu-latest
    steps:
      - name: Verify ${{ github.head_ref }} is allowed to merge into ${{ github.base_ref }}
        run: |
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"
          case "$base" in
            develop)
              exit 0 ;; # anything may merge into develop
            staging)
              case "$head" in
                develop|production|hotfix/*) exit 0 ;;
                *) echo "::error::'$head' -> 'staging' is not allowed. staging only accepts develop, production (back-merge), or hotfix/*."; exit 1 ;;
              esac
              ;;
            production)
              case "$head" in
                staging|hotfix/*) exit 0 ;;
                *) echo "::error::'$head' -> 'production' is not allowed. production only accepts staging or hotfix/* — not even develop directly."; exit 1 ;;
              esac
              ;;
            *)
              exit 0 ;; # any other target branch (e.g. a feature branch) is unrestricted
          esac

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7 # keep in sync with the team's local toolchain
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # google-services.json written to android/app/ acts as the fallback for
      # every Android flavor when a per-flavor src/<flavor>/google-services.json
      # is absent (as in CI). The iOS plist is copied into place by
      # ios/scripts/firebase_config.sh during an Xcode build; analyze/test do not
      # need it.
      - name: Create Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --dart-define-from-file=dart_define/dev.json

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.flavor }})
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        include:
          # One Android smoke build per flavor that PRs into develop can ship.
          # Each flavor's Gradle applicationId differs (.dev / .staging), so each
          # needs a google-services.json whose package matches — pulled from that
          # flavor's GitHub Environment secret and written to src/<flavor>/ below.
          # production is intentionally NOT built here: its Environment is
          # review-gated (Required reviewers), which would freeze the PR check.
          # deploy.yml builds the production flavor on every release tag.
          - platform: Android
            os: ubuntu-latest
            flavor: dev
            github_environment: development
            command: >-
              flutter build apk --debug
              --flavor dev -t lib/main_dev.dart
              --dart-define-from-file=dart_define/dev.json

          - platform: Android
            os: ubuntu-latest
            flavor: staging
            github_environment: staging
            command: >-
              flutter build apk --debug
              --flavor staging -t lib/main_staging.dart
              --dart-define-from-file=dart_define/staging.json

          # Schemeless iOS smoke build. Per-flavor iOS builds need the Xcode
          # schemes + per-config baseConfigurationReference wiring done properly
          # in Xcode — a later phase (see docs/flavors/CICD.md). Until then a
          # plain production-entry build is the reliable PR check. No
          # github_environment: it reads the repo-level iOS plist secret.
          - platform: iOS
            os: macos-latest
            flavor: production
            command: >-
              flutter build ios --debug --no-codesign
              -t lib/main_prod.dart
              --dart-define-from-file=dart_define/prod.json

    runs-on: ${{ matrix.os }}
    # Empty for the iOS row -> that job runs without an environment.
    environment: ${{ matrix.github_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7 # keep in sync with the team's local toolchain
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create Firebase configuration (Android)
        if: matrix.platform == 'Android'
        env:
          # Resolved from the matrix row's GitHub Environment (development /
          # staging), each holding its own value under this same name.
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          # Flavor-scoped location: the Google Services Gradle plugin reads
          # src/<flavor>/google-services.json before the app-level fallback.
          mkdir -p "android/app/src/${{ matrix.flavor }}"
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > "android/app/src/${{ matrix.flavor }}/google-services.json"

      - name: Create Firebase configuration (iOS)
        if: matrix.platform == 'iOS'
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          # iOS build phase copies the flavor plist; provide a default so a plain
          # (schemeless) build still finds one.
          mkdir -p ios/Runner/Firebase/production
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/Firebase/production/GoogleService-Info.plist

      - name: Build
        run: ${{ matrix.command }}
