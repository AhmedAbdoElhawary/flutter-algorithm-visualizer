name: Flutter V_0.1.0

# PR quality gate only. Nothing is pushed straight to develop, staging or
# production — the branch rulesets refuse it — so every change arrives here
# first. Once the PR is merged, .github/workflows/release-on-merge.yml creates
# the tag and calls deploy.yml.
#
# The single required status check on all three branches is `ci-ok` at the
# bottom of this file, not the individual jobs: build-android's check name
# contains the target branch, so it cannot be named in a ruleset.
on:
  pull_request:
    branches:
      - develop
      - staging
      - production

permissions:
  contents: read
  pull-requests: read # release-commit-guard reads the PR's own commit list

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-guard:
    name: Merge direction check
    runs-on: ubuntu-latest
    steps:
      - name: Verify ${{ github.head_ref }} is allowed to merge into ${{ github.base_ref }}
        run: |
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"
          case "$base" in
            develop)
              exit 0 ;; # anything may merge into develop
            staging)
              case "$head" in
                develop|production|hotfix/*) exit 0 ;;
                *) echo "::error::'$head' -> 'staging' is not allowed. staging only accepts develop, production (back-merge), or hotfix/*."; exit 1 ;;
              esac
              ;;
            production)
              case "$head" in
                staging|hotfix/*) exit 0 ;;
                *) echo "::error::'$head' -> 'production' is not allowed. production only accepts staging or hotfix/* — not even develop directly."; exit 1 ;;
              esac
              ;;
            *)
              exit 0 ;; # any other target branch (e.g. a feature branch) is unrestricted
          esac

  # A PR asks for a dev build by carrying one commit whose SUBJECT is
  # "release: v1.0.1-dev.16" and whose body is the tag message. The tag itself
  # is created by release-on-merge.yml after the merge — this job only checks
  # the request is well formed, so a typo fails the PR instead of failing after
  # it has already landed on develop.
  release-commit-guard:
    name: Release marker check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate the "release:" commit, if the PR has one
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Read the PR's commits from the API rather than the local history:
          # this has to agree with release-on-merge.yml, which reads the same
          # list so that a squash merge cannot lose the marker.
          commits="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/commits" \
            --paginate \
            --jq '.[] | (.commit.message | split("\n")) as $l
                  | [$l[0], (($l[1:] | join("")) | gsub("\\s"; "") | length | tostring)]
                  | @tsv')"

          markers=0
          tag=""
          body_len=0
          while IFS=$'\t' read -r subject len; do
            case "$subject" in
              release:*) ;;
              *) continue ;;
            esac
            markers=$((markers + 1))
            tag="${subject#release: }"
            body_len="$len"
          done <<< "$commits"

          if [ "$markers" -eq 0 ]; then
            if [ "$BASE" = "develop" ]; then
              echo "No 'release:' commit — this PR merges without shipping anything."
              exit 0
            fi
            echo "No 'release:' commit — '$BASE' derives its own tag after the merge."
            exit 0
          fi

          if [ "$BASE" != "develop" ]; then
            echo "::error::a 'release:' commit is only for PRs into develop. The '$BASE' tag is derived automatically after the merge — remove '$tag'."
            exit 1
          fi

          if [ "$markers" -gt 1 ]; then
            echo "::error::this PR has $markers 'release:' commits. A PR may ship at most one tag."
            exit 1
          fi

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$'; then
            echo "::error::'$tag' is not a dev tag. A PR into develop must use v<x.y.z>-dev.<n>, e.g. v1.0.1-dev.16."
            exit 1
          fi

          if [ "$body_len" -eq 0 ]; then
            echo "::error::the 'release: $tag' commit has an empty body. Its body becomes the tag message — write what this build contains."
            exit 1
          fi

          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::tag '$tag' already exists. Pick the next free number."
            exit 1
          fi

          echo "OK — merging this PR will create '$tag' and ship a dev build."

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7 # keep in sync with the team's local toolchain
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # analyze/test are pure Dart — no Gradle, no Xcode — so this job never
      # needs an Android google-services.json. Only the iOS plist is written
      # here (kept for parity with build-ios's own copy of this step).
      - name: Create Firebase configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --dart-define-from-file=dart_define/dev.json

  # One Android build per PR, for the flavor that the PR's target branch ships:
  #   PR -> develop     builds flavor dev
  #   PR -> staging     builds flavor staging
  #   PR -> production  builds flavor production (its Environment is review-gated,
  #                     so this job pauses for a manual approval — rare, as only
  #                     staging / hotfix PRs may target production).
  build-android:
    name: Build Android (${{ github.base_ref }})
    needs: quality
    runs-on: ubuntu-latest
    # develop -> the "development" box; staging / production -> the same-named box.
    environment: ${{ github.base_ref == 'develop' && 'development' || github.base_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7 # keep in sync with the team's local toolchain
          cache: true

      - name: Resolve flavor from target branch
        id: map
        run: |
          case "${{ github.base_ref }}" in
            develop)    f=dev;        t=lib/main_dev.dart;     d=dart_define/dev.json ;;
            staging)    f=staging;    t=lib/main_staging.dart; d=dart_define/staging.json ;;
            production) f=production; t=lib/main_prod.dart;    d=dart_define/prod.json ;;
            *) echo "::error::unsupported base branch '${{ github.base_ref }}'"; exit 1 ;;
          esac
          { echo "flavor=$f"; echo "target=$t"; echo "dart_define=$d"; } >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Create Firebase configuration
        env:
          # Resolved from this job's GitHub Environment (development / staging /
          # production), each holding its own value under this same name.
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          # Flavor-scoped location: the Google Services Gradle plugin reads
          # src/<flavor>/google-services.json before the app-level fallback.
          mkdir -p "android/app/src/${{ steps.map.outputs.flavor }}"
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > "android/app/src/${{ steps.map.outputs.flavor }}/google-services.json"

      - name: Build
        run: >-
          flutter build apk --debug
          --flavor ${{ steps.map.outputs.flavor }}
          -t ${{ steps.map.outputs.target }}
          --dart-define-from-file=${{ steps.map.outputs.dart_define }}

  # Schemeless iOS smoke build — same for every target branch. Per-flavor iOS
  # builds need the Xcode schemes + per-config baseConfigurationReference wiring
  # done properly in Xcode (a later phase). Until then
  # a plain production-entry build is the reliable check. No environment: it
  # reads the repo-level iOS plist secret.
  build-ios:
    name: Build iOS (schemeless)
    needs: quality
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7 # keep in sync with the team's local toolchain
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create Firebase configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          # iOS build phase copies the flavor plist; provide a default so a plain
          # (schemeless) build still finds one.
          mkdir -p ios/Runner/Firebase/production
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/Firebase/production/GoogleService-Info.plist

      - name: Build
        run: >-
          flutter build ios --debug --no-codesign
          -t lib/main_prod.dart
          --dart-define-from-file=dart_define/prod.json

  # The one required status check on develop, staging and production. Every job
  # above must succeed for this to pass, so adding a job later automatically
  # tightens the gate without touching the ruleset.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [merge-guard, release-commit-guard, quality, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every check passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          failed="$(printf '%s' "$results" | jq -r 'to_entries | map(select(.value.result != "success") | .key) | join(" ")')"
          if [ -n "$failed" ]; then
            echo "::error::these checks did not pass: $failed"
            exit 1
          fi
          echo "All checks passed."
