name: Flutter V_0.1.0

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # google-services.json written to android/app/ acts as the fallback for
      # every Android flavor when a per-flavor src/<flavor>/google-services.json
      # is absent (as in CI). The iOS plist is copied into place by
      # ios/scripts/firebase_config.sh during an Xcode build; analyze/test do not
      # need it.
      - name: Create Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --dart-define-from-file=dart_define/dev.json

  build:
    name: Build ${{ matrix.platform }}
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
            # Android flavors work through Gradle productFlavors out of the box.
            command: >-
              flutter build apk --debug
              --flavor dev -t lib/main_dev.dart
              --dart-define-from-file=dart_define/dev.json

          - platform: iOS
            os: macos-latest
            # No --flavor yet: the Debug-dev / Release-dev Xcode configs + schemes
            # are a one-time manual step (see docs/IOS_XCODE_SETUP.md). Until they
            # exist, build the production entry point without a flavor. Once the
            # schemes are committed, switch to:
            #   flutter build ios --debug --no-codesign --flavor dev
            #   -t lib/main_dev.dart --dart-define-from-file=dart_define/dev.json
            command: >-
              flutter build ios --debug --no-codesign
              -t lib/main_prod.dart
              --dart-define-from-file=dart_define/prod.json

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          # iOS build phase copies the flavor plist; provide a default so a plain
          # (schemeless) build still finds one.
          mkdir -p ios/Runner/Firebase/production
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/Firebase/production/GoogleService-Info.plist

      - name: Build
        run: ${{ matrix.command }}
