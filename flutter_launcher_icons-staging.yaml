# Regenerates the staging launcher icon for every density, every Android
# version (legacy, adaptive, Android 13+ monochrome/themed) and every iOS
# appearance (light, dark, tinted).
#
# Source art: tool/flavor_icons/custom/stagingLogoHere.png. It's currently
# just a copy of the production icon (see tool/flavor_icons/custom/README.md)
# — drop a custom staging design in at that same path, no config changes
# needed, then:
#   dart run flutter_launcher_icons -f flutter_launcher_icons-staging.yaml
#
# Writes Android output to android/app/src/staging/res/** and an `AppIcon-staging`
# set into the iOS asset catalog.
flutter_launcher_icons:
  image_path: "tool/flavor_icons/custom/stagingLogoHere.png"
  image_path_ios_dark_transparent: "tool/flavor_icons/custom/stagingLogoHere.png"
  image_path_ios_tinted_grayscale: "tool/flavor_icons/custom/stagingLogoHere.png"
  desaturate_tinted_to_grayscale_ios: true

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "tool/flavor_icons/custom/stagingLogoHere.png"
  adaptive_icon_monochrome: "tool/flavor_icons/custom/stagingLogoHere.png"

  ios: true
  remove_alpha_ios: true
