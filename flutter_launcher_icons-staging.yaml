# Regenerates the staging launcher icon for every density, every Android
# version (legacy, adaptive, Android 13+ monochrome/themed) and every iOS
# appearance (light, dark, tinted).
#
# Source art: assets/logo/algodive-icon-staging.png (STAGING badge, sand
# #D9AE72). Regenerate with:
#   flutter pub run flutter_launcher_icons -f flutter_launcher_icons-staging.yaml
#
# Writes Android output to android/app/src/staging/res/** and an `AppIcon-staging`
# set into the iOS asset catalog.
flutter_launcher_icons:
  image_path: "assets/logo/algodive-icon-staging.png"
  image_path_ios_dark_transparent: "assets/logo/algodive-icon-staging.png"
  image_path_ios_tinted_grayscale: "assets/logo/algodive-icon-staging.png"
  desaturate_tinted_to_grayscale_ios: true

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/logo/algodive-icon-staging.png"
  adaptive_icon_monochrome: "assets/logo/algodive-icon-staging.png"

  ios: true
  remove_alpha_ios: true
