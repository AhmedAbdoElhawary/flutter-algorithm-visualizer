# Regenerates the dev launcher icon for every density, every Android version
# (legacy, adaptive, Android 13+ monochrome/themed) and every iOS appearance
# (light, dark, tinted).
#
# Source art: tool/flavor_icons/custom/devLogoHere.png. It's currently just a
# copy of the production icon (see tool/flavor_icons/custom/README.md) — drop
# a custom dev design in at that same path, no config changes needed, then:
#   dart run flutter_launcher_icons -f flutter_launcher_icons-dev.yaml
#
# The `-dev` filename suffix makes flutter_launcher_icons write Android output to
# android/app/src/dev/res/** and an `AppIcon-dev` set into the iOS asset catalog.
flutter_launcher_icons:
  image_path: "tool/flavor_icons/custom/devLogoHere.png"
  image_path_ios_dark_transparent: "tool/flavor_icons/custom/devLogoHere.png"
  image_path_ios_tinted_grayscale: "tool/flavor_icons/custom/devLogoHere.png"
  desaturate_tinted_to_grayscale_ios: true

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "tool/flavor_icons/custom/devLogoHere.png"
  adaptive_icon_monochrome: "tool/flavor_icons/custom/devLogoHere.png"

  ios: true
  remove_alpha_ios: true
