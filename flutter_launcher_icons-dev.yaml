# Regenerates the dev launcher icon for every density, every Android version
# (legacy, adaptive, Android 13+ monochrome/themed) and every iOS appearance
# (light, dark, tinted).
#
# Source art: assets/logo/algodive-icon-dev.png (DEV badge, rose #DE8189).
# Regenerate with:
#   flutter pub run flutter_launcher_icons -f flutter_launcher_icons-dev.yaml
#
# The `-dev` filename suffix makes flutter_launcher_icons write Android output to
# android/app/src/dev/res/** and an `AppIcon-dev` set into the iOS asset catalog.
flutter_launcher_icons:
  image_path: "assets/logo/algodive-icon-dev.png"
  image_path_ios_dark_transparent: "assets/logo/algodive-icon-dev.png"
  image_path_ios_tinted_grayscale: "assets/logo/algodive-icon-dev.png"
  desaturate_tinted_to_grayscale_ios: true

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/logo/algodive-icon-dev.png"
  adaptive_icon_monochrome: "assets/logo/algodive-icon-dev.png"

  ios: true
  remove_alpha_ios: true
